# Warm pools for agent runs. The generated network policy blocks the Pod Identity endpoint, so it is turned off here.
# Replicas stay at 0 until the warm batch runs, so that idle pods do not take the capacity of the cold batch.
{"apiVersion": "extensions.agents.x-k8s.io/v1beta1", "kind": "SandboxTemplate", "metadata": {"name": "wpa-x86-gvisor", "namespace": "sandboxes"}, "spec": {"networkPolicyManagement": "Unmanaged", "podTemplate": {"spec": {"serviceAccountName": "sandbox", "nodeSelector": {"bench/group": "x86-gvisor"}, "containers": [{"name": "agent", "image": "ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/sbx-bench/agent:base-amd64", "imagePullPolicy": "IfNotPresent", "ports": [{"containerPort": 8080}], "resources": {"requests": {"cpu": "250m", "memory": "512Mi"}, "limits": {"cpu": "2", "memory": "8Gi"}}, "readinessProbe": {"httpGet": {"path": "/ping", "port": 8080}, "periodSeconds": 1, "failureThreshold": 600}}], "runtimeClassName": "gvisor"}}}}
---
{"apiVersion": "extensions.agents.x-k8s.io/v1beta1", "kind": "SandboxWarmPool", "metadata": {"name": "wpa-x86-gvisor", "namespace": "sandboxes"}, "spec": {"replicas": 0, "sandboxTemplateRef": {"name": "wpa-x86-gvisor"}}}
---
{"apiVersion": "extensions.agents.x-k8s.io/v1beta1", "kind": "SandboxTemplate", "metadata": {"name": "wpa-x86-kata", "namespace": "sandboxes"}, "spec": {"networkPolicyManagement": "Unmanaged", "podTemplate": {"spec": {"serviceAccountName": "sandbox", "nodeSelector": {"bench/group": "x86-kata"}, "containers": [{"name": "agent", "image": "ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/sbx-bench/agent:base-amd64", "imagePullPolicy": "IfNotPresent", "ports": [{"containerPort": 8080}], "resources": {"requests": {"cpu": "250m", "memory": "512Mi"}, "limits": {"cpu": "2", "memory": "8Gi"}}, "readinessProbe": {"httpGet": {"path": "/ping", "port": 8080}, "periodSeconds": 1, "failureThreshold": 600}}], "runtimeClassName": "kata-qemu-runtime-rs"}}}}
---
{"apiVersion": "extensions.agents.x-k8s.io/v1beta1", "kind": "SandboxWarmPool", "metadata": {"name": "wpa-x86-kata", "namespace": "sandboxes"}, "spec": {"replicas": 0, "sandboxTemplateRef": {"name": "wpa-x86-kata"}}}
